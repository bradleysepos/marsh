---
Build:
  Name: Marsh Example Website
  Description: Yet Another Example Website
  URL: https://bradleysepos.github.io/marsh-example
  Path: public
  Targets:
    - Name:   Marsh Example Website
      Path:   .
      Force:  true
      Source: source/*
      Template:
        Source: ../templates/default
        #Config: templates/default/template-extra.yaml
    - Name:   About Marsh Example
      Path:   about
      Force:  true
      Source: source/about
      Template:
        Source: ../templates/default
        #Config: templates/default/template-extra.yaml
    - Name:   Marsh Example News
      Path:   news
      Force:  true
      Source: source/news
      Template:
        Source: ../templates/default
        #Config: templates/default/template-extra.yaml
      Archives:
        - Name:     Marsh Example News
          Path:     index.markdown
          #Count:    10
          Types:    [ news ]
          Exclude:  [ draft ]
        - Name:     Marsh Example News
          Path:     feed.xml
          Encoding: atom
          #Count:    10
          Types:    [ news ]
          Exclude:  [ draft ]
        - Name:     Marsh Example News
          Path:     feed.json
          Encoding: json
          #Count:    10
          Types:    [ news ]
          Exclude:  [ draft ]
...
