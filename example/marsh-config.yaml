---
Build:
  Name: marsh example website
  Description: Example static website built with marsh
  URL: https://bradleysepos.github.io/marsh-example
  Path: public
  Targets:
    - Name:   marsh example website
      Path:   .
      Force:  true
      Source: source/*
      Sitemap: site-map/index.markdown
      Template:
        Source: ../templates/example
        #Overrides:
        #  - ../templates/example/template-overrides.yaml
      Archives:
        - Name:      marsh paginated news archive
          Path:      news/index.markdown
          Root_Path: news
          Encoding:  html
          #Count:     10
          Page_Size: 10
          Types:     [ news ]
          Exclude_States: [ draft ]
          #Template:
          #  Source: ../templates/example
          #  Overrides:
          #    - ../templates/example/template-overrides.yaml
        - Name:      marsh full news archive
          Path:      news/all/index.markdown
          Root_Path: news
          Encoding:  html
          #Count:     10
          Types:     [ news ]
          Exclude_States:  [ draft ]
        - Name:      marsh News Feed
          Path:      news/feed.xml
          Root_Path: news
          Encoding:  atom
          Count:     20
          Types:     [ news ]
          Exclude_States: [ draft ]
        - Name:      marsh News Feed
          Path:      news/feed.json
          Root_Path: news
          Encoding:  json
          Count:     20
          Types:     [ news ]
          Exclude_States: [ draft ]
...
